[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclean-kuntal"
version = "0.1.2"
description = "Auto-detect and fix messy data in one function call"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "KUNTALinGITHUB", email = "kuntal.pal7550@gmail.com" }
]
keywords = [
    "data cleaning", "pandas", "csv", "data quality",
    "data science", "preprocessing", "etl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.3",
    "chardet>=4.0",
    "rapidfuzz>=3.0",
    "python-dateutil>=2.8",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/KUNTALinGITHUB/dataclean"
Repository = "https://github.com/KUNTALinGITHUB/dataclean"
Issues = "https://github.com/KUNTALinGITHUB/dataclean/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88